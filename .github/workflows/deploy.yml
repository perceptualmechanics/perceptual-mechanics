name: Build and Deploy

on:
  push:
    branches:
      - main

# The job checks out this repo and rsyncs dist/ over SSH; it never writes
# back to GitHub (no releases, no pages, no commit statuses, no package
# publishing). Left unset it would run with whatever the repo/org default
# token scope is -- historically read/write on contents -- while also
# holding the production DREAMHOST_SSH_KEY, so anything that got code
# execution in this job could push to the repo as well as to the server.
# Least privilege: checkout needs contents:read, and nothing here needs
# more than that.
permissions:
  contents: read

# Two pushes landing close together used to start two deploys that both
# run `rsync --delete` against the live document root. Interleaved, one
# run's delete pass can remove files the other run has just written --
# a partially-deleted live site with no failed build to point at.
# Serialize on a single named group instead.
#
# cancel-in-progress: false is the load-bearing half. Cancelling would
# kill an in-flight rsync partway through its transfer/delete pass and
# leave exactly the half-written document root this group exists to
# prevent; far better to let a superseded deploy finish and be
# overwritten in order by the next one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to full commit SHAs, not floating tags. A tag is
      # mutable: whoever controls the action's repo can re-point v4 at new
      # code at any time, and this job runs with secrets.DREAMHOST_SSH_KEY
      # in its environment, so a re-pointed tag is arbitrary code execution
      # against the production server. The trailing comment records which
      # release each SHA is, since a bare hash is unreadable -- update both
      # together (`git ls-remote --tags https://github.com/actions/<name>`)
      # when bumping. Pinned 2026-09-01; both SHAs are what the v4 tag
      # resolved to at that time, so this changed nothing about what runs.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 20's security support window ended 2026-04-30 (checked
          # against endoflife.date, 2026-08-25) -- was still pinned here
          # for months after. Node 24 is current Active LTS (see
          # package.json's own `engines` field, and NOTES.md's periodic
          # best-practices review). vite 6's own engines range
          # (^18||^20||>=22) already covers this.
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # packages/bardjs is a workspace, not a toy: src/scenes/theater/theater.js
      # imports Player, compileLegacyScript, shuffle and asciiBubble from it,
      # which makes it the Theater scene's whole timing engine. Its 20
      # node --test tests existed and passed all along but nothing ever ran
      # them in CI, so a regression there shipped silently. The root
      # `npm test` fans out to every workspace that declares one
      # (--if-present), so adding a test script to a future workspace wires
      # it in here automatically. Runs before the build: no reason to spend
      # build time on code whose tests already fail.
      - name: Test
        run: npm test

      # Gate the dependency-advisory regression class the same way. This
      # was added after a HIGH advisory (nanoid GHSA-2v37-7h3g-55p8, pulled
      # in dev-only through vite -> postcss) sat unnoticed in the lockfile;
      # nothing in CI would have said so. --audit-level=high fails only on
      # high/critical, so a low/moderate transitive advisory with no fix
      # available doesn't block a deploy of unrelated content.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DREAMHOST_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan can fail on a transient DNS/connectivity blip, and
          # this step runs under `bash -e`, so that alone was enough to
          # kill the whole deploy before rsync ever ran (2026-07-23 --
          # traced from a live site that kept serving stale content after
          # a push). Every downstream step already sets
          # StrictHostKeyChecking=no, so known_hosts here was never
          # load-bearing -- safe to make this non-fatal, same as the SSH
          # connection test below already is.
          ssh-keyscan -H pdx1-shared-a1-46.dreamhost.com >> ~/.ssh/known_hosts || true

      - name: Test SSH connection
        run: |
          # -v, not -vvv: level 3 dumps full key-exchange and
          # authentication negotiation detail into a build log that is
          # public on this repo. -v is enough to tell "connected" from
          # "auth failed", which is all this step is for.
          ssh -v -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            copper_prism@pdx1-shared-a1-46.dreamhost.com "echo connected" || true

      - name: Deploy via rsync
        run: |
          # -rlptDzv (was -rlgoDzvc). -g/-o ask to preserve group and
          # owner, which a non-root SSH login cannot do -- they were
          # silently no-ops. -t (preserve mtimes) was missing, which is
          # what forced -c: with no usable timestamps rsync's quick check
          # is blind, so every deploy had to read and checksum every file
          # in dist/ on both ends to decide what to send. Preserving mtimes
          # instead lets the default size+mtime quick check do that work,
          # and adds -p (permissions) so a mode change actually propagates.
          rsync -rlptDzv --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=no" \
            dist/ \
            copper_prism@pdx1-shared-a1-46.dreamhost.com:/home/copper_prism/perceptualmechanics.com

      # ─── Post-deploy header check ────────────────────────────────────────
      # .htaccess is the one part of this project that cannot be tested
      # anywhere but production. Every build gate in vite.config.js runs
      # against source; none of them can tell you whether Apache actually
      # applied a single line of it. That gap is not hypothetical: the CSP
      # went enforcing in 3.12.1 and quietly served eight unstyled /text/
      # pages for months, and the six security headers below were found
      # missing in 4.0 by fetching the live site by hand, because nothing
      # ever fetched it automatically.
      #
      # So the deploy now proves its own server config. This also retires a
      # manual watch step: HSTS ships at max-age=300 deliberately, and the
      # only thing that short window is really guarding against is DreamHost
      # not emitting the header at all (mod_headers absent, .htaccess not
      # read, an override disallowed). This step answers that on the first
      # deploy instead of asking someone to remember to check, after which
      # raising 300 to 31536000 is a one-line change made on evidence.
      #
      # A cache-buster because index.html is served with max-age=0 but the
      # edge can still hold a copy — see NOTES.md's "verify a deploy through
      # a cache-buster" entry, learned the hard way in 1.7.0.
      - name: Verify live security headers
        run: |
          set -euo pipefail
          echo "waiting for the deploy to settle"
          sleep 10
          headers=$(curl -sS -D - -o /dev/null "https://perceptualmechanics.com/?cb=${GITHUB_SHA}")
          echo "$headers"
          fail=0
          for h in \
            "strict-transport-security" \
            "x-content-type-options" \
            "referrer-policy" \
            "permissions-policy" \
            "x-frame-options" \
            "cross-origin-opener-policy" \
            "content-security-policy"
          do
            if ! printf '%s' "$headers" | grep -qi "^$h:"; then
              echo "::error::$h is not being served — .htaccess did not take effect"
              fail=1
            fi
          done
          if ! curl -sSf -o /dev/null "https://perceptualmechanics.com/text/?cb=${GITHUB_SHA}"; then
            echo "::error::/text/ did not return 200"
            fail=1
          fi
          exit $fail

      # ─── The /text/ style hash, checked against the live policy ──────────
      # This replaces a check that claimed more than it did. The line above
      # used to carry the comment "fetching one proves the policy that ships
      # is the policy those pages were hashed against" — and it fetched the
      # page and looked at the status code. A stylesheet blocked by CSP does
      # not change the status code. The bug this was named for, eight /text/
      # pages served unstyled from 3.12.1 until 4.0, returned 200 for months.
      #
      # So the comment was wrong while the code was fine, which is its own
      # failure mode: a check's comment is a claim, and nothing verifies it.
      # It is the fourth instance of one shape on this project — verify-links
      # comparing corrupt text against corrupt text, an audit scoped by
      # symptom, a corpus measurement that never said which export it counted,
      # and now this. See the chat brief's content rules.
      #
      # What it does now, which is what that sentence always described:
      # fetch the page, pull the <style> block out of the bytes that were
      # actually served, hash it the same way vite.config.js's csp-style-hash
      # gate hashes the emitted one, and assert that hash appears in the
      # Content-Security-Policy header on that same response. Deterministic,
      # needs no server, and it runs on every deploy rather than waiting for a
      # visitor with the right browser to trip the violation.
      #
      # Reading the header from the /text/ response rather than from / is
      # deliberate: it is the policy that actually governs that page, and a
      # per-directory .htaccess could in principle make them differ.
      - name: Verify the /text/ inline style is allowed by the live policy
        run: |
          set -euo pipefail
          python3 - "$GITHUB_SHA" <<'PY'
          import base64, hashlib, re, sys, urllib.request

          url = f"https://perceptualmechanics.com/text/?cb={sys.argv[1]}"
          with urllib.request.urlopen(url, timeout=30) as r:
              body = r.read().decode("utf-8")
              csp = r.headers.get("Content-Security-Policy", "")

          if not csp:
              print("::error::/text/ served no Content-Security-Policy header")
              sys.exit(1)

          # Same extraction as vite.config.js's verifyStyleHash: first block,
          # non-greedy, and the bytes hashed are exactly what sits between the
          # tags — leading and trailing newline included.
          m = re.search(r"<style>([\s\S]*?)</style>", body)
          if not m:
              print("::error::/text/ served no inline <style> block. If page() deliberately stopped emitting one, this check and PAGE_STYLE_SHA256 both retire in the same change.")
              sys.exit(1)

          served = "sha256-" + base64.b64encode(
              hashlib.sha256(m.group(1).encode("utf-8")).digest()).decode()

          if served in csp:
              print(f"ok: /text/ inline style {served} is allowed by the policy on its own response")
              sys.exit(0)

          allowed = re.findall(r"'(sha256-[A-Za-z0-9+/=]+)'", csp)
          print("::error::the live policy does not allow the style the live page is serving — "
                "the /text/ pages are rendering unstyled right now")
          print(f"  served style hashes to: {served}")
          print(f"  policy allows:          {allowed or '(no style hashes at all)'}")
          print("  Fix: put the served value in PAGE_STYLE_SHA256 (scripts/prerender.js) and in "
                "style-src in public/.htaccess, then redeploy. Both, or the archive stays unstyled.")
          sys.exit(1)
          PY
