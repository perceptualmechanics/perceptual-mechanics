<!--
  Constellation scene shell markup — title/hint (fixed on document.body,
  same z-index/stacking-context reasoning every scene with body-level
  chrome shares — see butterfly.css's header comment) plus a real
  read-more panel mounted inside this scene's own container, same
  convention as sphere/orbiter/library/scroll's own panels.
  constellation.js parses this file and mounts/removes each piece itself.

  Round 8 (2026-08-18): the panel used to open on a touched STRAND (one
  rationale, two named endpoints) — round 8 dropped drawn connection
  lines entirely in favor of Kuramoto phase-sync (see constellation.js's
  own header), so the panel now opens on a touched NODE instead, and a
  node can carry more than one resonance (the corpus's one real hub
  currently carries five). `.constellation-panel-subtitle` and
  `.constellation-panel-resonances` replace the old single rationale
  paragraph + two-endpoint-button layout with a repeatable one
  (rationale + jump button) per resonance the clicked node participates
  in, built entirely in JS since the count varies node to node.

  Round 10 (2026-08-18): added .constellation-sound-toggle — sonification
  maps live Kuramoto data to real oscillators, but browsers block audio
  autoplay without a genuine gesture, so this button is the explicit
  first-interaction trigger AND the ongoing mute control (constellation.js
  builds the actual audio graph lazily, on first click). Same round,
  `.constellation-panel-resonances`' per-entry content changed from a
  rationale-first layout to a side-by-side excerpt pair (both pieces' own
  text) — still built entirely in JS, no template change needed here
  beyond this note. Round 10.1 removed the rationale caption paragraph
  that briefly sat under the excerpts; the rationale still picks which
  quoted span each excerpt centers on, it just isn't printed anymore.
-->
<p class="constellation-title" aria-hidden="true">Harmonics</p>
<p class="constellation-hint" aria-hidden="true">drag to orbit &nbsp;&middot;&nbsp; scroll to zoom &nbsp;&middot;&nbsp; touch a node</p>
<button type="button" class="constellation-sound-toggle" aria-pressed="false">
  <span class="constellation-sound-toggle-dot" aria-hidden="true"></span>
  <span class="constellation-sound-toggle-label">Sound off</span>
</button>

<aside class="constellation-panel" role="dialog" aria-modal="false" aria-labelledby="constellation-panel-title">
  <button type="button" class="constellation-panel-close" aria-label="Close resonance panel">&#10005;</button>
  <h2 id="constellation-panel-title" class="constellation-panel-title" tabindex="-1">A piece</h2>
  <p class="constellation-panel-subtitle"></p>
  <div class="constellation-panel-resonances"></div>
</aside>
