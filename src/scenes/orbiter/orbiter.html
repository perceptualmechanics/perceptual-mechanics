<!--
  Orbiter scene shell markup — full scene only (preview mode never mounts
  any of this). The poem panel's title/content/refs are genuinely dynamic
  (swapped per-satellite-click, with cross-link HTML built per poem in
  orbiter.js's renderPoemInto/renderStanza; .orbiter-panel-refs filled by
  the same function — see sceneKit.js's formatInboundNote) so only the
  panel's static skeleton — close button, empty title/content/refs slots —
  lives here.
-->

<!-- Site-wide title consistency pass (2026-08-25) briefly gave this scene
     an "ORBITER" title line above the existing "sing, orbiter" line;
     per Scott's same-day follow-up, only the subtitle stays — no
     separate uppercase title here. -->
<div class="orbiter-title" aria-hidden="true">
  <span class="orbiter-title-sub">sing, orbiter</span>
</div>

<p class="orbiter-hint" aria-hidden="true">drag to orbit &nbsp;·&nbsp; click a satellite to read a poem &nbsp;·&nbsp; click the nucleus to look inside</p>

<aside class="orbiter-panel" role="dialog" aria-modal="false" aria-labelledby="orbiter-panel-title">
  <button type="button" class="orbiter-panel-close" aria-label="Close panel">&#10005;</button>
  <h2 id="orbiter-panel-title" class="orbiter-panel-title" tabindex="-1"></h2>
  <div class="orbiter-panel-content"></div>
  <p class="orbiter-panel-refs"></p>
</aside>
