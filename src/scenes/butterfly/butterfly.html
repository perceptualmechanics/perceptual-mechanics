<!--
  Butterfly scene shell markup — the title label and hint paragraph, both
  fixed on document.body rather than inside this scene's own container (see
  butterfly.css's header comment for the z-index/stacking-context reasoning
  every scene with body-level chrome shares). butterfly.js parses this file
  and mounts/removes these itself, same pattern as sphere.html, orbiter.html,
  etc.

  aria-hidden stays on the hint only (v4.0). The hint is navigation
  instructions for a pointer device — nothing for a screen reader to gain
  from. The label above it is not chrome: per butterfly.text.js's own
  header, "Chaos Butterfly in Phase Space, 2026" IS the entire found text
  of this piece, the same category of content as every other scene's
  passages, which all get announced. Hiding the work's own text from the
  one visitor who can only reach it through the AT tree was never the
  intent of hiding the instructions next to it.
-->
<div class="butterfly-exp-label-row"><p class="butterfly-exp-label">Chaos Butterfly in Phase Space, 2026</p></div>
<p class="butterfly-hint" aria-hidden="true">drag to orbit &nbsp;&middot;&nbsp; scroll to zoom</p>
