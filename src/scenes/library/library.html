<!--
  Library scene shell markup — full mode only. The bookshelf, Library-of-
  Babel backdrop, and every spine/item mesh are built entirely as Three.js
  geometry in library.js, so they have no HTML counterpart; this file is
  just the hint text and the read-more panel's skeleton. This scene
  briefly had a bottom-center title/subtitle ("Library" / "the library —
  once removed") in the 2026-08-25 site-wide title consistency pass;
  removed again same day, both lines, per Scott's call — no title chrome
  here.

  .library-hint is appended straight to <body> (fixed over the whole
  viewport, same convention as sphere/orbiter's own hint), while
  .library-panel is appended into the scene container. library.js pulls
  both out of this one fragment by class and places each where it
  belongs.

  library-panel-title keeps a real id — it's the target of the panel's
  aria-labelledby, which per spec has to resolve to an actual id, not a
  class. Every other panel part is styled and looked up purely by class.

  There is no library-panel-note here any more: the catalog's `note` field
  was removed wholesale in 4.11.21 (src/links.js records why), so the element
  had nothing left to fill it.

  library-panel-refs is the inbound-reference note ("Referenced from X") —
  filled by library.js's populatePanel via sceneKit.js's formatInboundNote,
  same quiet-metadata convention as sphere's facet-id line and orbiter's
  own panel-refs. Only numeric (non-CD) items ever have anything to show
  here, since links.js only addresses numeric piece ids.
-->

<p class="library-hint" aria-hidden="true">drag to orbit &nbsp;&middot;&nbsp; scroll to zoom &nbsp;&middot;&nbsp; click a spine to read &nbsp;&middot;&nbsp; click a CD to watch</p>

<aside class="library-panel" role="dialog" aria-modal="false" aria-labelledby="library-panel-title">
  <button type="button" class="pm-panel-close library-panel-close" aria-label="Close panel">&#10005;</button>
  <div class="library-panel-body">
    <p class="library-panel-kind"></p>
    <h2 id="library-panel-title" class="library-panel-title" tabindex="-1"></h2>
    <p class="library-panel-creator"></p>
    <div class="library-panel-video"></div>
    <p class="library-panel-scene"></p>
    <img class="library-panel-cover" hidden alt="" />
    <p class="library-panel-excerpt"></p>
    <p class="library-panel-excerpt-from"></p>
    <div class="library-panel-details"></div>
    <p class="library-panel-refs"></p>
  </div>
</aside>
