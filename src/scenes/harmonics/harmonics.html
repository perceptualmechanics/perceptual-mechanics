<!--
  harmonics scene shell markup — title/hint (fixed on document.body,
  same z-index/stacking-context reasoning every scene with body-level
  chrome shares — see butterfly.css's header comment) plus a real
  read-more panel mounted inside this scene's own container, same
  convention as sphere/orbiter/library/scroll's own panels.
  harmonics.js parses this file and mounts/removes each piece itself.

  Round 8 (2026-08-18): the panel used to open on a touched STRAND (one
  rationale, two named endpoints) — round 8 dropped drawn connection
  lines entirely in favor of Kuramoto phase-sync (see harmonics.js's
  own header), so the panel now opens on a touched NODE instead, and a
  node can carry more than one resonance (the corpus's one real hub
  currently carries five). `.harmonics-panel-subtitle` and
  `.harmonics-panel-resonances` replace the old single rationale
  paragraph + two-endpoint-button layout with a repeatable one
  (rationale + jump button) per resonance the clicked node participates
  in, built entirely in JS since the count varies node to node.

  Round 10 (2026-08-18): added .harmonics-sound-toggle — sonification
  maps live Kuramoto data to real oscillators, but browsers block audio
  autoplay without a genuine gesture, so this button is the explicit
  first-interaction trigger AND the ongoing mute control (harmonics.js
  builds the actual audio graph lazily, on first click). Same round,
  `.harmonics-panel-resonances`' per-entry content changed from a
  rationale-first layout to a side-by-side excerpt pair (both pieces' own
  text) — still built entirely in JS, no template change needed here
  beyond this note. Round 10.1 removed the rationale caption paragraph
  that briefly sat under the excerpts; the rationale still picks which
  quoted span each excerpt centers on, it just isn't printed anymore.

  v4.0: `.pm-scene-chrome` on the sound toggle. harmonics.js appends that
  button to document.body (the same body-level chrome convention the title
  and hint use), but main.js's focus trap only ever queried inside
  #experience-container — so the toggle was rendered, styled, focusable in
  principle and completely unreachable by Tab while the scene was open. The
  trap now also collects `.pm-scene-chrome`; this class is how it finds it.
-->
<div class="harmonics-title-row"><p class="harmonics-title" aria-hidden="true">Harmonics</p></div>
<p class="harmonics-hint" aria-hidden="true">drag to orbit &nbsp;&middot;&nbsp; scroll to zoom &nbsp;&middot;&nbsp; touch a node</p>
<button type="button" class="harmonics-sound-toggle pm-scene-chrome" aria-pressed="false">
  <span class="harmonics-sound-toggle-dot" aria-hidden="true"></span>
  <span class="harmonics-sound-toggle-label">Sound off</span>
</button>

<aside class="harmonics-panel" role="dialog" aria-modal="false" aria-labelledby="harmonics-panel-title">
  <button type="button" class="harmonics-panel-close" aria-label="Close resonance panel">&#10005;</button>
  <h2 id="harmonics-panel-title" class="harmonics-panel-title" tabindex="-1">A piece</h2>
  <p class="harmonics-panel-subtitle"></p>
  <div class="harmonics-panel-resonances"></div>
</aside>
