<!--
  outside scene shell markup — title/hint/sound-toggle fixed on
  document.body, same convention every scene with body-level chrome
  shares (see harmonics.html's own header). That's all there is: round 2
  (2026-08-24) removed the account-label element and the read-more panel
  entirely — this scene is a pure visual object, closer to Butterfly's
  register than Harmonics', and nothing in it displays a word once it's
  running. Round 3, same day: the projection diagram this chrome
  originally sat over was fully replaced by a generated flower (see
  outside.js's own round-3 header note), but the no-text/no-panel rule
  itself didn't change, so none of this markup needed to. Touching the
  flower triggers a real traveling pulse across its surface instead
  (outside.js's triggerPulse), not a panel.
-->
<div class="outside-title-row"><p class="outside-title" aria-hidden="true">Outside</p></div>
<p class="outside-hint" aria-hidden="true">drag to orbit &nbsp;&middot;&nbsp; scroll to zoom &nbsp;&middot;&nbsp; touch a petal</p>
<button type="button" class="outside-sound-toggle" aria-pressed="false">
  <span class="outside-sound-toggle-dot" aria-hidden="true"></span>
  <span class="outside-sound-toggle-label">Sound off</span>
</button>
<div class="outside-sr-live" aria-live="polite"></div>
