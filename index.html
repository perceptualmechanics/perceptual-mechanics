<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="author" content="Scott Jason Cohen"/>
  <meta name="description" content="Perceptual Mechanics — a digital art project by Scott Jason Cohen. Interactive visualizations of chaos, language, and phase space."/>
  <link rel="canonical" href="https://perceptualmechanics.com/"/>

  <!-- Favicon: "PM" monogram, white on black, echoing #site-title's own
       treatment -- swapped in 2026-07-23 for the earlier hare-silhouette
       version (Scott: "never mind, make it the letters PM like from the
       title"). Reads cleanly at 32px/180px; any two-letter mark this
       small softens a bit at 16px, which is why every size still gets
       its own explicit <link> instead of relying on one image alone. -->
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://perceptualmechanics.com/"/>
  <meta property="og:title" content="perceptual mechanics"/>
  <meta property="og:description" content="Perceptual Mechanics — a digital art project by Scott Jason Cohen. Interactive visualizations of chaos, language, and phase space."/>
  <meta property="og:image" content="https://perceptualmechanics.com/social-card.png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <!-- og:image:alt is the alt text for the card image itself, read out by
       screen readers on the platforms that render these (and by nothing
       else) -- the card was the one image on the site with no alt text of
       any kind. og:site_name and og:locale round the card out: without the
       former, a shared link's attribution line falls back to whatever the
       platform guesses from the bare domain. -->
  <meta property="og:image:alt" content="The words &quot;perceptual mechanics&quot; in white on black."/>
  <meta property="og:site_name" content="perceptual mechanics"/>
  <meta property="og:locale" content="en_US"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="perceptual mechanics"/>
  <meta name="twitter:description" content="Perceptual Mechanics — a digital art project by Scott Jason Cohen. Interactive visualizations of chaos, language, and phase space."/>
  <meta name="twitter:image" content="https://perceptualmechanics.com/social-card.png"/>

  <!-- Structured data. `keywords` here is schema.org's actual, still-live
       equivalent of the old <meta name="keywords"> tag -- that one's been
       ignored by Google since 2009 (Bing doesn't weight it either), but
       this property genuinely feeds crawlers' topic understanding. Terms
       below are pulled straight from the site's own ten live scenes
       (Outside, 2026-08-24, was the tenth -- this comment said nine until
       4.0, which is the kind of count that quietly goes stale every time
       the nav-icon math does; see main.css's #pm-nav rule for the other
       place a scene count is load-bearing). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "perceptual mechanics",
    "url": "https://perceptualmechanics.com/",
    "description": "Perceptual Mechanics — a digital art project by Scott Jason Cohen. Interactive visualizations of chaos, language, and phase space.",
    "author": { "@type": "Person", "name": "Scott Jason Cohen" },
    "creator": { "@type": "Person", "name": "Scott Jason Cohen" },
    "keywords": [
      "interactive art", "generative art", "creative coding",
      "WebGL art", "Three.js", "browser-based art",
      "chaos theory", "Lorenz attractor", "phase space visualization",
      "hypertext fiction", "digital poetry", "illuminated scroll",
      "orrery", "solar system model", "interactive fiction",
      "ASCII theater", "quantum orbital visualization", "digital library",
      "optical reflection simulation", "EUV lithography"
    ]
  }
  </script>

  <!-- Fonts: self-hosted as of 2026-08-31 (was Google Fonts CDN — see
       styles/main.css's "Self-hosted fonts" block for the full rationale
       and the dead-weight-family audit). Electrolize is preloaded here
       because it's the only font visible above-the-fold (#site-title on
       #landing, inherited via body's font-family) — this is where the
       actual LCP win comes from; every other family still loads on demand
       exactly as it did from the CDN, just from this origin instead. -->
  <link rel="preload" href="/fonts/electrolize-400.woff2" as="font" type="font/woff2" crossorigin>
  <title>perceptual mechanics</title>
  <meta name="theme-color" content="#000000"/>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

  <a href="#landing" class="skip-link">Skip to main content</a>

  <!-- Every piece on this site is drawn live in a canvas, so with scripting
       off the page was genuinely blank: no message, no content, no way on.
       That was a three-line gap rather than a hard problem, because the
       site already ships a full plain-text version of every piece under
       /text/ (the prerender step, 1.7.0) — so the fallback isn't a stub
       apology, it's a real route to the actual writing. Plain <a> and <p>
       only: whatever turned scripting off may well be a text browser, a
       reader mode, or a crawler. -->
  <noscript>
    <div id="noscript-fallback">
      <p><strong>perceptual mechanics</strong></p>
      <p>The pieces here are drawn live in the browser and need JavaScript to run.</p>
      <p><a href="/text/">Read the writing on its own</a> — every piece of writing
      on this site, set down as plain pages.</p>
    </div>
  </noscript>

  <!-- Persistent nav bar — all ten live scenes. The icon count is not
       decoration: #pm-nav sizes itself from a `--nav-count` custom property
       in styles/main.css that must be kept equal to the number of buttons
       below. See that rule's comment for why (four separate production
       regressions of icons clipped off both edges). -->
  <nav id="pm-nav" aria-label="Perceptual Mechanics navigation">

    <!-- Every nav icon's aria-label is now its title text, not a one-word
         name. It used to be aria-label="Sphere" alongside
         title="The Sphere — Interconnected Text Fragments", and aria-label
         WINS over title for an accessible name — so a screen-reader user
         got "Sphere" while a mouse user hovering the same button got the
         real, useful one. Strictly backwards. The preview tiles below
         already had this right (short title for the tooltip, fuller
         aria-label for the name); the icons match them now.
         No inline onmouseover/onfocus here any more either — the status-bar
         glimpse is wired from main.js off the data-scene these buttons
         already carry. See main.js's pmGlimpse comment for why that also
         fixed the easter egg firing four times per hover. -->

    <button type="button" class="nav-icon" data-scene="sphere" aria-label="The Sphere — Interconnected Text Fragments" title="The Sphere — Interconnected Text Fragments">

    <button type="button" class="nav-icon" data-scene="orrery" aria-label="The Orrery of Los Feliz" title="The Orrery of Los Feliz">

    <!-- Orbiter -->
    <button type="button" class="nav-icon" data-scene="orbiter" aria-label="Orbiter — A p-Orbital, Satellites" title="Orbiter — A p-Orbital, Satellites">

         every other scene already gets. Nodes pulsing in shared rhythm,

    <button type="button" class="nav-icon" data-scene="harmonics" aria-label="Harmonics" title="Harmonics">

        <circle cx="12" cy="4.6" r="1.1"/>
      </svg>
    </button>

    <!-- Outside (src/scenes/outside/) — tenth scene, pivoted round 3
         (2026-08-24) to a floral cosmology map. Icon is a real five-petal
         flower (five simple teardrop petals at 72-degree intervals, a
         small center dot for the seedpod/Magi-Psi) — the same five-fold

    <button type="button" class="nav-icon" data-scene="outside" aria-label="Outside" title="Outside">

    </button>

    <!-- Apollo. The icon is the scene: a band with lines taken out of it,
         including one close pair — the sodium doublet is the whole reason the
         sonification is worth listening to, and two strokes 1px apart at icon
         size is as close as 24 units gets to saying so.

         An earlier eleventh icon and tile lived here for one afternoon,
         2026-09-02, and came out again when Spectra was shelved; the markup is
         in that commit and src/scenes/spectra/SHELVED.md lists it alongside
         the other two edits a restore needs. --nav-count in main.css is the
         third, and it is the one value an added or removed icon changes. -->
    <button type="button" class="nav-icon" data-scene="apollo" aria-label="Apollo — An Absorption Spectrum You Can Play" title="Apollo — An Absorption Spectrum You Can Play">

    <!-- Psyshell. Twelve rays from a small dense centre, at unequal lengths —
         the flower's own rule (petal length is sentence length) rather than a
         uniform asterisk, which is what a spoked wheel would read as. Twelve
         because that is what stays separable at the 25.3px this icon gets at
         320px; the scene has 3,221 and neither number is the other's job. -->
    <button type="button" class="nav-icon" data-scene="psyshell" aria-label="Psyshell — Flower Magic" title="Psyshell — Flower Magic">

  </nav>

  <!-- Site title — bottom center, links back to gallery. Semantic pass,
       2026-07-22: was <a href="#" role="button"> — it never actually
       navigated anywhere (main.js's click handler always preventDefault()s
       and calls returnToGallery() itself), so a real <button> is what
       this always semantically was. -->
  <!-- #site-title-row is a plain, non-semantic positioning wrapper (styles/main.css) —
       #site-title itself stays the real interactive element, unaffected for a11y/click. -->
  <div id="site-title-row">
    <button type="button" id="site-title" aria-label="Return to gallery" data-glimpse="title">perceptual mechanics</button>
  </div>

  <!-- Fullscreen toggle — persistent, site-wide, wired once here at the same
       shared-chrome level as #pm-nav/#site-title (main.js) rather than
       duplicated into each of the ten scenes' own body-level chrome, the
       way the sound toggle currently is (only 2 of 10 scenes have one, so
       there's no truly site-wide sound-toggle slot to actually match).
       Standard Fullscreen API, applied to the whole page (documentElement),
       not just the open scene's own canvas. Starts `hidden` and main.js
       only reveals it if the Fullscreen API is actually present —
       iOS Safari has no element/document fullscreen outside a <video>,
       a real platform ceiling, not a bug to paper over with a dead button. -->
  <button type="button" id="fullscreen-toggle" aria-pressed="false" aria-label="Enter fullscreen" title="Fullscreen" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H4a1 1 0 0 0-1 1v4M16 3h4a1 1 0 0 1 1 1v4M8 21H4a1 1 0 0 1-1-1v-4M16 21h4a1 1 0 0 0 1-1v-4"/>
    </svg>
  </button>

  <!-- Landing -->
  <!-- tabindex="-1": <main> is not focusable on its own, so the skip link
       above moved only the scroll position and left focus sitting on the
       link itself — the next Tab went straight back into the nav the
       visitor had just asked to skip. -1 makes it a programmatic focus
       target without adding it to the tab order. main.js's own handler
       decides at click time whether "main content" means this or the open
       scene's container. -->
  <main id="landing" tabindex="-1">
    <!-- a11y audit, 2026-07-22: the page had zero headings anywhere —
         screen-reader users navigating by heading had nothing to land on.
         Visually hidden (.sr-only, styles/main.css) rather than a visible
         h1, since a second on-screen title would duplicate #site-title
         and clash with the deliberately minimal landing design. -->
    <h1 class="sr-only">Perceptual Mechanics — an interactive art gallery by Scott Jason Cohen</h1>
    <!-- Semantic pass, 2026-07-22: was <div role="list">/<div role="listitem">
         /<div role="button" tabindex="0"> with a manual keydown handler for
         Enter/Space in main.js. Real <ul>/<li>/<button> need none of that
         ARIA stand-in machinery — a <button> gets Enter/Space activation
         built in, so main.js's keydown listener was removed along with it
         (see main.js's own comment at the click handler). "Press Enter to
         expand" stays in each aria-label; still accurate, keyboard users
         still need to know it's actionable, just via native semantics now
         instead of an ARIA role announcing it. -->
    <ul id="scene-previews" aria-label="Interactive art pieces">

      <!-- Design pass, 2026-07-17: added a `title` to every tile, matching
           its nav-icon counterpart's own title text — the icons already had
           a native hover tooltip, the preview circles never did, so mousing
           over a silent WebGL loop gave a sighted visitor no idea what it
           was before clicking. Doesn't touch layout or visuals, screen
           readers already had the fuller aria-label. -->
      <li class="preview-wrapper" data-scene="sphere">
        <button type="button" class="preview-container" id="preview-sphere"
             title="The Sphere — Interconnected Text Fragments"
             aria-label="The Sphere — an interactive geodesic sphere with text fragments. Press Enter to expand.">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="scroll">
        <button type="button" class="preview-container" id="preview-scroll"
             title="Selected Works — A Scroll of Found Writing"
             aria-label="A scroll of found writing — carved fragments, 2000 to 2012. Press Enter to expand.">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="orrery">
        <button type="button" class="preview-container" id="preview-orrery"
             title="The Orrery of Los Feliz"
             aria-label="The Orrery of Los Feliz — a found story, told through a 30-foot orrery. Press Enter to expand.">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="orbiter">
        <button type="button" class="preview-container" id="preview-orbiter"
             title="Orbiter — A p-Orbital, Satellites"
             aria-label="Orbiter — a hydrogen atom's p-orbital rendered as a fuzzy probability cloud, with satellites in orbit around it. Press Enter to expand.">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="butterfly">
        <button type="button" class="preview-container" id="preview-butterfly"
             title="Chaos Butterfly in Phase Space, 2026"
             aria-label="Chaos Butterfly in Phase Space, 2026 — a Lorenz attractor visualization. Press Enter to expand.">
        </button>
      </li>

      <!-- A hand-placed `.preview-row-break` used to sit here, forcing the
           wrap after the 5th tile. It is gone as of 4.4.0, and the reason is
           its own history: it was moved after the 4th tile, then after the
           5th, and its comment had to keep explaining which scene currently
           occupied that slot and that the break wasn't tied to it. That is a
           layout decision re-made by hand every time the scene count changes,
           which is the same shape as the nav-icon bug that clipped icons off
           both edges four separate times. main.js now derives the column count
           from the registry and inserts the breaks itself — see tileColumns()
           there and #scene-previews in styles/main.css. -->

      <li class="preview-wrapper" data-scene="library">
        <button type="button" class="preview-container" id="preview-library"
             title="The Library — once removed"
             aria-label="The Library — a real bookshelf, 107 books, films, and divination decks, rebuilt as a shelf you can turn in space. Press Enter to expand.">
        </button>
      </li>

      <!-- Harmonics: a genuinely live preview, same as every other tile
           here (each one is a real, continuously-running mini scene
           instance, never a static image) — the resonance graph's
           Kuramoto phase sync runs unconditionally regardless of
           `preview`, so this tile shows real, currently-converging
           pulsing the whole time it's on screen, not a frame chosen to
           stand in for motion it can't show. -->
      <li class="preview-wrapper" data-scene="harmonics">
        <button type="button" class="preview-container" id="preview-harmonics"
             title="Harmonics"
             aria-label="Harmonics — resonant pieces across every other scene, laid out by how strongly they connect and pulsing in sync with whatever they resonate with. Press Enter to expand.">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="beamline">
        <button type="button" class="preview-container" id="preview-beamline"
             title="Beamline"
             aria-label="Beamline — a staged sequence of curved mirrors, a beam of light bouncing between them, found text surfacing at each bounce. Press Enter to expand.">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="theater">
        <button type="button" class="preview-container" id="preview-theater"
             title="The Theater — Now Playing"
             aria-label="The Theater — scenes from Truth and Beauty, Paul Revere, and You've Got a Friend in Satan, performed by ASCII actors. Press Enter to expand.">
        </button>
      </li>

      <!-- Outside: a genuinely live preview, same as every other tile —
           the breathing cycle runs unconditionally regardless of
           `preview`, so this tile shows the real flower gently breathing
           the whole time it's on screen. -->
      <li class="preview-wrapper" data-scene="outside">
        <button type="button" class="preview-container" id="preview-outside"
             title="Outside"
             aria-label="Outside — a generated lotus mapping the five Sources of Power as petals and their Folk Origins, Magi and Psi at the center, breathing continuously. Press Enter to expand.">
        </button>
      </li>

      <!-- Apollo: complete on the first frame it paints, unlike every other
           tile here. There is nothing to accumulate — the band is drawn whole
           and four elements are already in the light, so the 200px circle
           shows a spectrum with visible absorption lines immediately rather
           than converging toward one. Butterfly's thumbnail needing
           twenty-five seconds to reach its subject (fixed in 4.1.3) is the
           case this was designed against. -->
      <li class="preview-wrapper" data-scene="apollo">
        <button type="button" class="preview-container" id="preview-apollo"
             title="Apollo — An Absorption Spectrum You Can Play"
             aria-label="Apollo — a solar absorption spectrum you can play: a band of starlight with dark lines missing from it, and a corona streaming past. Press Enter to expand.">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="psyshell">
        <button type="button" class="preview-container" id="preview-psyshell"
             title="Psyshell — Flower Magic"
             aria-label="Psyshell — a white chrysanthemum made of every sentence on this site, one petal each, arranged by reading order and sized by sentence length. Press Enter to expand.">
        </button>
      </li>

    </ul>

    <!-- "Read the writing on its own" (1.7.0's /text/ prerender work) used to
         live here as its own persistent bottom-left link — moved into the
         colophon dialog as of 1.31.2, alongside the bibliography it belongs
         next to (see src/components/colophon.js), on both desktop and
         mobile. Partly undone in 4.0, for a reason the 1.31.2 move didn't
         weigh: the colophon copy is injected by JS, so no crawler and no
         scripting-off reader ever saw the link at all. #landing-textlink
         above is back as static markup, positioned above #site-title rather
         than beside it so it doesn't recreate the crowding below. It was never a mobile-only problem (crowded against
         #site-title/tiles at narrow widths, see the vignette below), just
         most visible there; the landing page didn't need a second
         persistent fixed-position link once the colophon already exists
         as the place for exactly this kind of "the actual machinery lives
         here" content. -->

    <!-- The site's one high-authority page linked to /text/ exactly nowhere
         in its served HTML: the only link lives inside the colophon, which
         is a ?raw fragment injected by JS into a display:none modal, so
         `dist/index.html` contained zero occurrences of href="/text/". Eight
         pages of the site's best writing, prerendered and in the sitemap,
         got no internal link equity from the page that has all of it. This
         is that link, static and crawlable.
         It is deliberately NOT the fixed bottom-left #landing-textlink that
         was removed in 1.31.2 for crowding — that one collided with
         #site-title at narrow widths. This sits above the title rather than
         beside it (see styles/main.css) and is a child of #landing, so it
         hides with the rest of the landing chrome when a scene opens,
         exactly like #landing-bottom-fade below. -->
    <a id="landing-textlink" href="/text/">read the writing on its own</a>

    <!-- Mobile bottom vignette, added 2026-08-03: on narrow viewports the
         preview grid becomes a single scrollable column taller than the
         viewport (see styles/main.css), so whichever tile lands at the
         bottom of the screen sits directly under the fixed #site-title at
         almost any scroll position — a real overlap, not an edge case.
         Purely decorative, aria-hidden; a sibling of the other fixed footer
         elements so it hides with them via #landing's own display:none in
         expandScene(). #landing-textlink is back as of 4.0 (see above) and
         deliberately sits inside this fade's band, where the gradient is
         what gives its small text a dark ground to read against. -->
    <div id="landing-bottom-fade" aria-hidden="true"></div>
  </main>

  <!-- Full screen experience overlay — no close button; nav is the navigation.

       aria-modal="true" was removed in 4.0. It asserts that everything
       outside this element is inert, and that has never been true here by
       design: #pm-nav (z-index 500) and #site-title-row (400) both sit
       ABOVE this overlay (300) and stay visible and clickable the whole
       time a scene is open — that is what "nav is the navigation" means,
       and on a touch device those two are the ONLY way out, since there is
       no Escape key to press. Keeping the attribute meant main.js had to
       keep hiding real, on-screen controls from assistive tech to make the
       claim honest, which is the a11y bug it was supposed to prevent. See
       main.js's focus-containment comment for the full reasoning. -->
  <div id="experience-overlay"
       role="dialog"
       aria-label="Full screen art experience"
       aria-hidden="true">
    <!-- Filled from SCENES[name].label by main.js. #landing owns the page's
         only other <h1> and is display:none while a scene is open, so
         exactly one of the two is ever in the AT tree. -->
    <h1 id="experience-heading" class="sr-only"></h1>
    <!-- role="main": with #landing hidden, a screen reader navigating this
         page by landmark found only NAV and a hidden MAIN. Static rather
         than toggled from JS — the overlay's own aria-hidden already takes
         this whole subtree out of the AT tree whenever a scene isn't open,
         so the document never exposes two mains at once. -->
    <div id="experience-container" role="main"></div>
    <!-- Shown only while a scene's module is still being fetched (main.js's
         expandScene, .pm-loading class) — a cold click against a chunk
         nothing prefetched yet. Purely decorative (the overlay's own
         aria-label already describes what's opening), so aria-hidden. -->
    <div id="experience-loading" aria-hidden="true"></div>
    <!-- ...and this is what's shown when it never arrives. The site's first
         error state of any kind: before 4.0 a rejected import() left the
         spinner turning forever and every control on the page dead (see
         main.js's showSceneLoadError). role="alert" so the swap from
         spinner to message is actually announced rather than silently
         replacing a decorative element. `hidden`, not a class, so its
         Reload button is genuinely out of the tab order until there is
         something to reload. -->
    <div id="experience-error" role="alert" hidden>
      <p class="experience-error-line">This piece didn’t load.</p>
      <p class="experience-error-line experience-error-fix">Reloading the page will bring it back.</p>
      <button type="button" id="experience-error-reload">Reload</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
