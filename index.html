<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="author" content="Scott Jason Cohen"/>
  <meta name="description" content="Perceptual Mechanics — a digital art project by Scott Jason Cohen. Interactive visualizations of chaos, language, and phase space."/>
  <link rel="canonical" href="https://perceptualmechanics.com/"/>

  <!-- Favicon: "PM" monogram, white on black, echoing #site-title's own
       treatment -- swapped in 2026-07-23 for the earlier hare-silhouette
       version (Scott: "never mind, make it the letters PM like from the
       title"). Reads cleanly at 32px/180px; any two-letter mark this
       small softens a bit at 16px, which is why every size still gets
       its own explicit <link> instead of relying on one image alone. -->
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://perceptualmechanics.com/"/>
  <meta property="og:title" content="perceptual mechanics"/>
  <meta property="og:description" content="Perceptual Mechanics — a digital art project by Scott Jason Cohen. Interactive visualizations of chaos, language, and phase space."/>
  <meta property="og:image" content="https://perceptualmechanics.com/social-card.png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="perceptual mechanics"/>
  <meta name="twitter:description" content="Perceptual Mechanics — a digital art project by Scott Jason Cohen. Interactive visualizations of chaos, language, and phase space."/>
  <meta name="twitter:image" content="https://perceptualmechanics.com/social-card.png"/>

  <!-- Structured data. `keywords` here is schema.org's actual, still-live
       equivalent of the old <meta name="keywords"> tag -- that one's been
       ignored by Google since 2009 (Bing doesn't weight it either), but
       this property genuinely feeds crawlers' topic understanding. Terms
       below are pulled straight from the site's own eight live scenes
       rather than reached-for (Prism shelved 2026-07-31, its two keyword
       terms dropped along with it; Leaf shelved again the same day after
       a brief re-enable, its own two terms dropped too; Beamline added
       the same day as a new scene, its own two terms added — see main.js's
       import comments). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "perceptual mechanics",
    "url": "https://perceptualmechanics.com/",
    "description": "Perceptual Mechanics — a digital art project by Scott Jason Cohen. Interactive visualizations of chaos, language, and phase space.",
    "author": { "@type": "Person", "name": "Scott Jason Cohen" },
    "creator": { "@type": "Person", "name": "Scott Jason Cohen" },
    "keywords": [
      "interactive art", "generative art", "creative coding",
      "WebGL art", "Three.js", "browser-based art",
      "chaos theory", "Lorenz attractor", "phase space visualization",
      "hypertext fiction", "digital poetry", "illuminated scroll",
      "orrery", "solar system model", "interactive fiction",
      "ASCII theater", "quantum orbital visualization", "digital library",
      "optical reflection simulation", "EUV lithography"
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Zen Maru Gothic dropped 2026-07-22 — was leaf.js's caption font only,
       now replaced by Coda there, so nothing on the site uses it anymore. -->
  <!-- Orbitron added 2026-08-03 — Beamline/Solar Sailer's own HUD-chrome
       font (hint text + station-number label), scoped there via CSS only;
       loaded here alongside every other scene's font for the same reason
       Electrolize etc. all live in this one combined request. -->
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;600&family=Patrick+Hand&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Ogham&family=Coda:wght@400;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <title>perceptual mechanics</title>
  <meta name="theme-color" content="#000000"/>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

  <a href="#landing" class="skip-link">Skip to main content</a>

  <!-- Persistent nav bar — eight live scenes (Leaf and Prism both shelved;
       Beamline added 2026-07-31, a new scene — see its own comment below
       and NOTES.md). -->
  <nav id="pm-nav" aria-label="Perceptual Mechanics navigation">

    <!-- Sphere: geodesic / icosahedron outline -->
    <button type="button" class="nav-icon" data-scene="sphere" aria-label="Sphere" title="The Sphere — Interconnected Text Fragments" onmouseover="pmGlimpse('sphere')" onfocus="pmGlimpse('sphere')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <ellipse cx="12" cy="12" rx="9" ry="4"/>
        <line x1="12" y1="3" x2="12" y2="21"/>
        <path d="M3 9h18M3 15h18"/>
      </svg>
    </button>

    <!-- Butterfly: Lorenz / figure-8 attractor shape -->
    <button type="button" class="nav-icon" data-scene="butterfly" aria-label="Butterfly" title="Chaos Butterfly in Phase Space, 2026" onmouseover="pmGlimpse('butterfly')" onfocus="pmGlimpse('butterfly')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 12 C8 6, 2 6, 3 12 C4 18, 10 17, 12 12"/>
        <path d="M12 12 C16 6, 22 6, 21 12 C20 18, 14 17, 12 12"/>
        <circle cx="12" cy="12" r="0.8" fill="currentColor"/>
      </svg>
    </button>

    <!-- Scroll: Ogham letter Sail, four strokes off a stemline -->
    <button type="button" class="nav-icon" data-scene="scroll" aria-label="Scroll" title="Selected Works — A Scroll of Found Writing" onmouseover="pmGlimpse('scroll')" onfocus="pmGlimpse('scroll')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="2.5" x2="6" y2="21.5"/>
        <line x1="6" y1="5.5" x2="19" y2="5.5"/>
        <line x1="6" y1="9.8" x2="19" y2="9.8"/>
        <line x1="6" y1="14.1" x2="19" y2="14.1"/>
        <line x1="6" y1="18.4" x2="19" y2="18.4"/>
      </svg>
    </button>

    <!-- Theater: film camera -->
    <button type="button" class="nav-icon" data-scene="theater" aria-label="The Theater" title="The Theater — Now Playing" onmouseover="pmGlimpse('theater')" onfocus="pmGlimpse('theater')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="12" height="10" rx="1"/>
        <path d="M15 10.2 L21 7.5 V16.5 L15 13.8"/>
        <circle cx="7.2" cy="5.6" r="1.5"/>
        <circle cx="12" cy="4.6" r="1.1"/>
      </svg>
    </button>

    <!-- Orbiter -->
    <button type="button" class="nav-icon" data-scene="orbiter" aria-label="Orbiter" title="Orbiter — A p-Orbital, Satellites" onmouseover="pmGlimpse('orbiter')" onfocus="pmGlimpse('orbiter')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="6"/>
        <path d="M12 3 C18 6 18 18 12 21"/>
        <path d="M12 3 C6 6 6 18 12 21"/>
        <circle cx="20" cy="9" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </button>

    <!-- Leaf: shelved again 2026-07-31, comment out don't delete (same
         pattern as Cycle, the golden hare mechanic, and Lens below) — see
         main.js's leaf.js import comment for the full re-enable checklist.
    <button type="button" class="nav-icon" data-scene="leaf" aria-label="Leaf" title="Leaf — In The End It Falls Slowly Through The Aether" onmouseover="pmGlimpse('leaf')" onfocus="pmGlimpse('leaf')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3c5 2 7 6 5 11-1.5 3.7-4 5.5-5 7-1-1.5-3.5-3.3-5-7-2-5 0-9 5-11z"/>
        <path d="M12 4v15"/>
      </svg>
    </button>
    -->

    <!-- Orrery: sun and concentric orbit rings, hung from a mast — was
         three shells rotated around a shared center, which reads as an
         atom (electron orbits), not an orrery (planets in one plane).
         Scott, 2026-07-17: "it's an atom now, not a solar system." -->
    <button type="button" class="nav-icon" data-scene="orrery" aria-label="Orrery" title="The Orrery of Los Feliz" onmouseover="pmGlimpse('orrery')" onfocus="pmGlimpse('orrery')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="12" x2="12" y2="2.5"/>
        <ellipse cx="12" cy="13" rx="9.5" ry="3.4"/>
        <ellipse cx="12" cy="13" rx="6.4" ry="2.3"/>
        <ellipse cx="12" cy="13" rx="3.6" ry="1.3"/>
        <circle cx="12" cy="13" r="1.5" fill="currentColor" stroke="none"/>
        <circle cx="19.9" cy="14.7" r="0.85" fill="currentColor" stroke="none"/>
        <circle cx="6.1" cy="11.9" r="0.65" fill="currentColor" stroke="none"/>
        <circle cx="14.9" cy="11.1" r="0.5" fill="currentColor" stroke="none"/>
      </svg>
    </button>

    <!-- Library: a 4x2 cube-shelf grid, spines as short verticals.
         Re-enabled 2026-07-23 -- see main.js's own comment at the import
         for why (a close-read of the catalog turned up real cross-title
         resonances, now wired in as clickable links, worth being able to
         click through). -->
    <button type="button" class="nav-icon" data-scene="library" aria-label="Library" title="The Library — once removed" onmouseover="pmGlimpse('library')" onfocus="pmGlimpse('library')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="3" width="19" height="18" rx="0.6"/>
        <line x1="12" y1="3" x2="12" y2="21"/>
        <line x1="2.5" y1="12" x2="21.5" y2="12"/>
        <line x1="5" y1="6.5" x2="5" y2="9.5"/>
        <line x1="7" y1="5.8" x2="7" y2="9.5"/>
        <line x1="9" y1="6.2" x2="9" y2="9.5"/>
        <line x1="15" y1="6.4" x2="15" y2="9.5"/>
        <line x1="17.3" y1="6" x2="17.3" y2="9.5"/>
        <line x1="5" y1="15.5" x2="5" y2="18.5"/>
        <line x1="7.3" y1="15" x2="7.3" y2="18.5"/>
        <line x1="16" y1="15.6" x2="16" y2="18.5"/>
        <line x1="18.2" y1="15.2" x2="18.2" y2="18.5"/>
      </svg>
    </button>

    <!-- Beamline: a beam bouncing between three angled mirror strokes —
         new scene, 2026-07-31. See NOTES.md. -->
    <button type="button" class="nav-icon" data-scene="beamline" aria-label="Beamline" title="Beamline" onmouseover="pmGlimpse('beamline')" onfocus="pmGlimpse('beamline')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 19 L9 10 L14 15 L21 5"/>
        <path d="M7.2 11.6 L10.8 8.4"/>
        <path d="M12 16.8 L16 13.2"/>
        <circle cx="3" cy="19" r="1" fill="currentColor" stroke="none"/>
        <circle cx="21" cy="5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </button>

    <!-- Prism: shelved 2026-07-31, comment out don't delete (same pattern as
         Cycle, the golden hare mechanic, Lens twice, and Leaf above) — see
         main.js's prism.js import comment for the full re-enable checklist
         and NOTES.md 1.19.0 for why. This was the second full attempt under
         this name (an organically-grown crystal, then this classical
         dispersion prism); neither landed, no third attempt is planned.
    <button type="button" class="nav-icon" data-scene="prism" aria-label="Prism" title="Prism — A Crystal, Grown" onmouseover="pmGlimpse('prism')" onfocus="pmGlimpse('prism')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 12 L12 3"/>
        <path d="M12 6 L10 4 M12 6 L14 3.5"/>
        <path d="M12 12 L19 8"/>
        <path d="M16 9.5 L18.5 8.5 M16 9.5 L17 11.5"/>
        <path d="M12 12 L18 17"/>
        <path d="M15.5 14.5 L17.5 15 M15.5 14.5 L15 16.5"/>
        <path d="M12 12 L6 18"/>
        <path d="M9 15 L7.5 16.5 M9 15 L10.5 16.5"/>
        <path d="M12 12 L4 11"/>
        <path d="M7 11.3 L5 10 M7 11.3 L6 13"/>
        <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    -->
  </nav>

  <!-- Site title — bottom center, links back to gallery. Semantic pass,
       2026-07-22: was <a href="#" role="button"> — it never actually
       navigated anywhere (main.js's click handler always preventDefault()s
       and calls returnToGallery() itself), so a real <button> is what
       this always semantically was. -->
  <button type="button" id="site-title" aria-label="Return to gallery" onmouseover="pmGlimpse('title')" onfocus="pmGlimpse('title')">perceptual mechanics</button>

  <!-- Landing -->
  <main id="landing">
    <!-- a11y audit, 2026-07-22: the page had zero headings anywhere —
         screen-reader users navigating by heading had nothing to land on.
         Visually hidden (.sr-only, styles/main.css) rather than a visible
         h1, since a second on-screen title would duplicate #site-title
         and clash with the deliberately minimal landing design. -->
    <h1 class="sr-only">Perceptual Mechanics — an interactive art gallery by Scott Jason Cohen</h1>
    <!-- Semantic pass, 2026-07-22: was <div role="list">/<div role="listitem">
         /<div role="button" tabindex="0"> with a manual keydown handler for
         Enter/Space in main.js. Real <ul>/<li>/<button> need none of that
         ARIA stand-in machinery — a <button> gets Enter/Space activation
         built in, so main.js's keydown listener was removed along with it
         (see main.js's own comment at the click handler). "Press Enter to
         expand" stays in each aria-label; still accurate, keyboard users
         still need to know it's actionable, just via native semantics now
         instead of an ARIA role announcing it. -->
    <ul id="scene-previews" aria-label="Interactive art pieces">

      <!-- Design pass, 2026-07-17: added a `title` to every tile, matching
           its nav-icon counterpart's own title text — the icons already had
           a native hover tooltip, the preview circles never did, so mousing
           over a silent WebGL loop gave a sighted visitor no idea what it
           was before clicking. Doesn't touch layout or visuals, screen
           readers already had the fuller aria-label. -->
      <li class="preview-wrapper" data-scene="sphere">
        <button type="button" class="preview-container" id="preview-sphere"
             title="The Sphere — Interconnected Text Fragments"
             aria-label="The Sphere — an interactive geodesic sphere with text fragments. Press Enter to expand."
             onmouseover="pmGlimpse('sphere')" onfocus="pmGlimpse('sphere')">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="butterfly">
        <button type="button" class="preview-container" id="preview-butterfly"
             title="Chaos Butterfly in Phase Space, 2026"
             aria-label="Chaos Butterfly in Phase Space, 2026 — a Lorenz attractor visualization. Press Enter to expand."
             onmouseover="pmGlimpse('butterfly')" onfocus="pmGlimpse('butterfly')">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="scroll">
        <button type="button" class="preview-container" id="preview-scroll"
             title="Selected Works — A Scroll of Found Writing"
             aria-label="A scroll of found writing — carved fragments, 2000 to 2012. Press Enter to expand."
             onmouseover="pmGlimpse('scroll')" onfocus="pmGlimpse('scroll')">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="theater">
        <button type="button" class="preview-container" id="preview-theater"
             title="The Theater — Now Playing"
             aria-label="The Theater — scenes from Truth and Beauty, Paul Revere, and You've Got a Friend in Satan, performed by ASCII actors. Press Enter to expand."
             onmouseover="pmGlimpse('theater')" onfocus="pmGlimpse('theater')">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="orbiter">
        <button type="button" class="preview-container" id="preview-orbiter"
             title="Orbiter — A p-Orbital, Satellites"
             aria-label="Orbiter — a hydrogen atom's p-orbital rendered as a fuzzy probability cloud, with satellites in orbit around it. Press Enter to expand."
             onmouseover="pmGlimpse('orbiter')" onfocus="pmGlimpse('orbiter')">
        </button>
      </li>

      <!-- Leaf: shelved again 2026-07-31, comment out don't delete — see
           main.js's leaf.js import comment for the full re-enable checklist.
      <li class="preview-wrapper" data-scene="leaf">
        <button type="button" class="preview-container" id="preview-leaf"
             title="Leaf — In The End It Falls Slowly Through The Aether"
             aria-label="Leaf — a raindrop's fall from a leaf, told through real physics, locked to one fixed view; the moment it hits the ground, a hard cut opens onto a free-camera cosmic scene. Press Enter to expand."
             onmouseover="pmGlimpse('leaf')" onfocus="pmGlimpse('leaf')">
        </button>
      </li>
      -->

      <li class="preview-wrapper" data-scene="orrery">
        <button type="button" class="preview-container" id="preview-orrery"
             title="The Orrery of Los Feliz"
             aria-label="The Orrery of Los Feliz — a found story, told through a 30-foot orrery. Press Enter to expand."
             onmouseover="pmGlimpse('orrery')" onfocus="pmGlimpse('orrery')">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="library">
        <button type="button" class="preview-container" id="preview-library"
             title="The Library — once removed"
             aria-label="The Library — a real bookshelf, 107 books, films, and divination decks, rebuilt as a shelf you can turn in space. Press Enter to expand."
             onmouseover="pmGlimpse('library')" onfocus="pmGlimpse('library')">
        </button>
      </li>

      <li class="preview-wrapper" data-scene="beamline">
        <button type="button" class="preview-container" id="preview-beamline"
             title="Beamline"
             aria-label="Beamline — a staged sequence of curved mirrors, a beam of light bouncing between them, found text surfacing at each bounce. Press Enter to expand."
             onmouseover="pmGlimpse('beamline')" onfocus="pmGlimpse('beamline')">
        </button>
      </li>

      <!-- Prism: shelved 2026-07-31, comment out don't delete — see main.js's
           prism.js import comment for the full re-enable checklist.
      <li class="preview-wrapper" data-scene="prism">
        <button type="button" class="preview-container" id="preview-prism"
             title="Prism — A Crystal, Grown"
             aria-label="Prism — an organically-grown crystal, one branch per piece of writing on the site, grown by a random-walk-and-stick algorithm rather than hand-placed. Drag to orbit, click a branch to read. Press Enter to expand."
             onmouseover="pmGlimpse('prism')" onfocus="pmGlimpse('prism')">
        </button>
      </li>
      -->
    </ul>

    <!-- "Read the writing on its own" (1.7.0's /text/ prerender work) used to
         live here as its own persistent bottom-left link — moved into the
         colophon dialog as of 1.31.2, alongside the bibliography it belongs
         next to (see src/components/colophon.js), on both desktop and
         mobile. It was never a mobile-only problem (crowded against
         #site-title/tiles at narrow widths, see the vignette below), just
         most visible there; the landing page didn't need a second
         persistent fixed-position link once the colophon already exists
         as the place for exactly this kind of "the actual machinery lives
         here" content. -->

    <!-- Mobile bottom vignette, added 2026-08-03: on narrow viewports the
         preview grid becomes a single scrollable column taller than the
         viewport (see styles/main.css), so whichever tile lands at the
         bottom of the screen sits directly under the fixed #site-title at
         almost any scroll position — a real overlap, not an edge case.
         Purely decorative, aria-hidden; a sibling of the other fixed footer
         elements so it hides with them via #landing's own display:none in
         expandScene(). #landing-textlink is gone as of 1.31.2 (see above)
         but #site-title alone still needs this. -->
    <div id="landing-bottom-fade" aria-hidden="true"></div>
  </main>

  <!-- Full screen experience overlay — no close button; nav is the navigation -->
  <div id="experience-overlay"
       role="dialog"
       aria-modal="true"
       aria-label="Full screen art experience"
       aria-hidden="true">
    <div id="experience-container"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
